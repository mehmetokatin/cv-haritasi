<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehmet Okatın – ACM · Şirket</title>
<meta name="description" content="Mehmet Okatın'ın ACM dersinde öğrendiklerini hayali bir şirketin katlarında senaryolarla uyguladığı uygulama yapısı.">
<meta name="theme-color" content="#05070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Uygulama yapisi sablonu: icerik yapi.json'dan gelir, tasarim herkes icin ortak.
   Baska bir kullanici (ör. tasarimci, atolye) yalnizca yapi.json ve kareler/ klasorunu degistirir. */
:root{
  color-scheme:dark;
  --ink:#05070b; --panel:#0d1016; --edge:#dce9ff; --amber:#ffb469;
  --text:#eef2f8; --muted:#9aa4b5; --bean:#62d6a2; --rule:rgba(220,233,255,.16);
  --display:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--display);font-size:17px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}

/* ust serit */
.hud{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;pointer-events:none}
.hud a,.hud button{pointer-events:auto}
.brand{font-weight:600;font-size:19px;text-decoration:none;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.brand span{color:var(--bean)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;background:rgba(5,7,11,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .2s}
.btn:hover{border-color:var(--edge)}

/* kat cubugu */
.rail{position:fixed;z-index:9;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.rail button{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rail i{display:block;width:14px;height:2px;background:var(--rule);transition:width .25s,background .25s}
.rail em{font-style:normal;font-family:var(--display);opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;white-space:nowrap}
.rail button:hover em,.rail button:focus-visible em{opacity:1;transform:none}
.rail button[aria-current="true"]{color:var(--text)}
.rail button[aria-current="true"] i{width:30px;background:var(--amber)}

section{scroll-snap-align:start;position:relative;min-height:100vh}

/* giris */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.hero .art{height:100vh;background:center/cover no-repeat;position:relative}
.hero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,11,0) 55%,var(--ink) 100%)}
.hero .copy{padding:110px clamp(24px,5vw,72px) 60px clamp(12px,2vw,24px);max-width:640px}
.badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.badge b{font-weight:500;color:var(--text)}
.hero h1{margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.4vw,56px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.hero h1 small{display:block;margin-top:10px;font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0}
.hero p.lead{margin:18px 0 0;color:#c9d0dc;max-width:56ch}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin:26px 0 0;padding:0;list-style:none}
.facts b{display:block;font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.facts span{display:block;margin-top:5px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border:1px solid var(--rule);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--bean);border-color:rgba(98,214,162,.45)}
.tag.ok::before{content:"";width:6px;height:6px;margin-right:6px;border-radius:50%;background:var(--bean)}
.note{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.hint{margin-top:30px;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.hint i{display:block;width:1px;height:28px;background:linear-gradient(180deg,var(--edge),rgba(220,233,255,0));animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%,100%{transform:translateY(-4px);opacity:.4}50%{transform:translateY(4px);opacity:1}}

/* katlar */
.room{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;align-items:stretch}
.room .art{position:relative;min-height:100vh;background:center/cover no-repeat}
.room .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,11,.0) 60%,var(--ink) 100%),linear-gradient(0deg,rgba(5,7,11,.55),rgba(5,7,11,0) 30%)}
.room .floorno{position:absolute;z-index:1;left:24px;bottom:18px;font-weight:700;font-size:clamp(70px,9vw,140px);line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(238,242,248,.75)}
.panel{display:flex;flex-direction:column;min-width:0;padding:96px clamp(70px,6vw,96px) 36px clamp(18px,2vw,28px);max-height:100vh;min-height:100vh}
.hero>*,.room>*{min-width:0}
body{overflow-x:hidden}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.eyebrow .no{color:var(--amber);font-weight:500}
.eyebrow .tag{margin-left:auto;text-transform:none;letter-spacing:0}
.panel h2{margin:10px 0 0;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--edge)}
.panel .q{margin:8px 0 0;font-weight:600;font-size:clamp(25px,2.4vw,34px);line-height:1.12;text-wrap:balance}
.who{margin:12px 0 0;display:grid;gap:3px;font-size:14px;color:var(--muted)}
.who b{color:var(--text);font-weight:500}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.tabs button{padding:6px 11px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:12px;color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.tabs button:hover{border-color:var(--edge);color:var(--text)}
.tabs button[aria-selected="true"]{border-color:var(--amber);color:var(--ink);background:var(--amber)}
.step{flex:1;min-height:0;overflow-y:auto;margin:14px 0 0;padding:16px 18px 18px;border:1px solid var(--rule);background:rgba(13,16,22,.7);-webkit-overflow-scrolling:touch}
.step h3{margin:0 0 10px;font-weight:600;font-size:21px;line-height:1.2}
.step p{margin:0 0 10px;color:#d5dbe6;max-width:66ch}
.step ul,.step ol{margin:6px 0 10px;padding-left:20px;color:#d5dbe6;display:grid;gap:5px}
.step table{width:100%;border-collapse:collapse;font-size:14.5px}
.step th,.step td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
.step th{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .scroll{overflow-x:auto}
.step pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.45;color:#cfd8e6;background:rgba(5,7,11,.6);border:1px solid var(--rule)}
.quote{margin:4px 0 12px;padding:10px 14px;border-left:2px solid var(--muted);font-style:italic;color:#e2e7ef}
.quote.real{border-left-color:var(--amber)}
.callout{margin:10px 0;padding:10px 14px;border:1px solid rgba(98,214,162,.35);background:rgba(98,214,162,.06);font-size:15px;color:#d9f2e6}
.callout.warn{border-color:rgba(255,180,105,.4);background:rgba(255,180,105,.07);color:#ffe3c6}
.k{color:var(--amber);border-bottom:1px dotted rgba(255,180,105,.6);cursor:help}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 0}
.nav .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chips button{padding:3px 9px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:#c9d0dc}
.chips button:hover{border-color:var(--amber);color:var(--text)}

/* gantt */
.gantt{display:grid;gap:6px;min-width:440px;margin-top:6px}
.gantt .row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;font-size:13px}
.gantt .bar{position:relative;height:16px;background:repeating-linear-gradient(90deg,rgba(220,233,255,.06) 0 1px,transparent 1px calc(100%/13))}
.gantt .b{position:absolute;top:2px;height:12px;border-radius:2px}
.gantt .b.crit{background:#a78bfa}
.gantt .b.ok{background:var(--bean)}
.gantt .b.slack{background:repeating-linear-gradient(45deg,rgba(98,214,162,.45) 0 3px,transparent 3px 6px);border:1px solid rgba(98,214,162,.5)}
.gantt .axis{display:grid;grid-template-columns:150px 1fr;gap:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.gantt .ticks{display:flex;justify-content:space-between}

/* yakinda + sozluk */
.wide{padding:110px clamp(22px,6vw,90px) 70px}
.wide h2{margin:0;font-weight:600;font-size:clamp(28px,3vw,40px)}
.wide p.sub{margin:8px 0 0;color:var(--muted)}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:26px 0 0}
.soon div{padding:16px 18px;border:1px dashed var(--rule);background:rgba(13,16,22,.6)}
.soon small{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.soon b{display:block;margin-top:6px;font-weight:600;font-size:19px}
.soon p{margin:6px 0 0;color:#c9d0dc;font-size:15px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:26px 0 0}
.gloss div{padding:12px 14px;border:1px solid var(--rule)}
.gloss b{display:block;font-weight:500;color:var(--amber)}
.gloss span{display:block;margin-top:4px;font-size:14.5px;color:#d5dbe6}
footer{padding:28px clamp(22px,6vw,90px) 40px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* kavram balonu */
.pop{position:fixed;z-index:20;max-width:320px;padding:12px 14px;border:1px solid var(--amber);background:var(--panel);font-size:14.5px;line-height:1.45;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
.pop b{display:block;color:var(--amber);font-weight:500;margin-bottom:4px}
.pop.on{display:block}

/* dar ekran */
@media (max-width:860px){
  html{scroll-snap-type:none}
  .rail{display:none}
  .hero,.room{grid-template-columns:1fr}
  .hero .art{height:56vh}
  .hero .art::after{background:linear-gradient(180deg,rgba(5,7,11,0) 55%,var(--ink) 100%)}
  .hero .copy{padding:0 20px 50px}
  .room .art{min-height:44vh}
  .room .art::after{background:linear-gradient(180deg,rgba(5,7,11,0) 60%,var(--ink) 100%)}
  .room .floorno{font-size:64px;left:16px;bottom:8px}
  .panel{max-height:none;min-height:0;padding:10px 18px 46px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .tabs button{flex:none}
  .step{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
</style>
</head>
<body>
<header class="hud">
  <a class="brand" href="../">Mehmet Okatın <span>CV</span></a>
  <a class="btn" href="../#yeditepe">← CV'ye dön</a>
</header>
<nav class="rail" id="rail" aria-label="Katlar"></nav>
<main id="app"><p style="padding:120px 24px;color:#9aa4b5">Yükleniyor…</p></main>
<div class="pop" id="pop" role="tooltip"></div>
<noscript><p style="padding:24px">Bu sayfa JavaScript ister.</p></noscript>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var pad = function(n){ return (n < 10 ? "0" : "") + n; };
var D = null, GL = {}, glKeys = [];

/* Metindeki kisa kavram adlarini sozlukteki tam karsiligina esle (ör. "Economic" -> "Economic feasibility"). */
function findTerm(t){
  t = (t || "").trim(); if (GL[t]) return t;
  var low = t.toLowerCase(), k;
  for (k = 0; k < glKeys.length; k++) if (glKeys[k].toLowerCase() === low) return glKeys[k];
  for (k = 0; k < glKeys.length; k++) if (glKeys[k].toLowerCase().indexOf(low) === 0) return glKeys[k];
  for (k = 0; k < glKeys.length; k++) if (glKeys[k].toLowerCase().indexOf(low) >= 0) return glKeys[k];
  return null;
}

function gantt(g){
  var w = 100 / g.toplam, h = '<div class="gantt">';
  g.gorevler.forEach(function(t){
    h += '<div class="row"><span>' + esc(t.ad) + '</span><div class="bar">' +
         '<span class="b ' + (t.kritik ? "crit" : "ok") + '" style="left:' + (t.bas * w) + '%;width:' + (t.sure * w) + '%"></span>' +
         (t.pay ? '<span class="b slack" style="left:' + ((t.bas + t.sure) * w) + '%;width:' + (t.pay * w) + '%"></span>' : "") +
         '</div></div>';
  });
  h += '<div class="axis"><span></span><div class="ticks">';
  for (var i = 0; i <= g.toplam; i += 1) h += "<span>" + (i % 2 ? "" : i) + "</span>";
  return h + "</div></div></div>";
}

function render(){
  var y = D, name = y.ad ? y.ad : "Adı yakında", open = y.odalar.length;
  document.title = y.sahip.ad + " – " + (y.ad ? y.ad + " · " : "") + y.tip.ad;
  var h = '<section class="hero" id="giris"><div class="art" style="background-image:url(\'' + esc(y.kapak) + '\')"></div><div class="copy">' +
    '<div class="badge">' + esc(y.ders.ad) + ' · <b>' + esc(y.tip.ad) + '</b></div>' +
    '<h1>' + esc(y.baslik) + '<small>' + esc(name) + ' · ' + esc(y.tip.ad) + '</small></h1>' +
    '<p class="lead">' + esc(y.aciklama) + '</p>' +
    '<ul class="facts"><li><b>' + open + '</b><span>açık kat</span></li><li><b>' + y.yakinda.length + '</b><span>yakında</span></li><li><b>' + glKeys.length + '</b><span>kavram</span></li></ul>' +
    '<p class="note"><span class="tag' + (y.dogrulama.durum === "dogrulanmis" ? " ok" : "") + '">' + (y.dogrulama.durum === "dogrulanmis" ? "Doğrulanmış" : "Beyan") + '</span> ' + esc(y.dogrulama.not) + ' ' + esc(y.ders.not) + '</p>' +
    '<div class="hint"><i></i>Kaydırarak katlara gir</div></div></section>';

  y.odalar.forEach(function(r, i){
    h += '<section class="room" id="' + esc(r.id) + '" data-i="' + i + '"><div class="art" style="background-image:url(\'' + esc(r.kare) + '\')"><span class="floorno">' + pad(i + 1) + '</span></div>' +
      '<div class="panel"><div class="eyebrow"><span class="no">' + pad(i + 1) + '/' + pad(open) + '</span><span>' + esc(r.birim) + '</span><span>' + esc(r.bolum) + '</span>' +
      '<span class="tag' + (r.tur === "gercek" ? " ok" : "") + '" title="' + (r.tur === "gercek" ? "Kendi işimde yaşadığım gerçek durum" : "Gerçek işimden yola çıkan senaryo") + '">' + (r.tur === "gercek" ? "Gerçek" : "Senaryo") + '</span></div>' +
      '<h2>' + esc(r.ad) + '</h2><p class="q">' + esc(r.soru) + '</p>' +
      '<div class="who"><span><b>Rolüm:</b> ' + esc(r.rol) + '</span><span><b>Karşımdaki:</b> ' + esc(r.karsi) + '</span></div>' +
      '<div class="tabs" role="tablist">' + r.adimlar.map(function(s, j){ return '<button role="tab" data-r="' + i + '" data-s="' + j + '" aria-selected="' + (j === 0) + '">' + esc(s.etiket) + '</button>'; }).join("") + '</div>' +
      '<div class="step" id="step' + i + '" role="tabpanel"></div>' +
      '<div class="nav"><button class="btn" data-prev="' + i + '">← Önceki</button><span class="count" id="cnt' + i + '"></span><button class="btn" data-next="' + i + '">Sonraki →</button></div>' +
      '<div class="chips">' + r.kavramlar.map(function(c){ return '<button data-term="' + esc(c) + '">' + esc(c) + '</button>'; }).join("") + '</div>' +
      '</div></section>';
  });

  h += '<section class="wide" id="yakinda"><h2>Yakında açılacak katlar</h2><p class="sub">Her biri dersin başka bir konusunu bir departmanın sorunuyla birleştirecek.</p><div class="soon">' +
    y.yakinda.map(function(r){ return '<div><small>' + esc(r.birim) + '</small><b>' + esc(r.ad) + '</b><p>“' + esc(r.soru) + '”</p></div>'; }).join("") + '</div></section>';
  h += '<section class="wide" id="sozluk"><h2>Kavram sözlüğü</h2><p class="sub">Katlarda geçen ' + glKeys.length + ' kavram, kendi cümlelerimle.</p><div class="gloss">' +
    glKeys.map(function(k){ return '<div><b>' + esc(k) + '</b><span>' + esc(GL[k]) + '</span></div>'; }).join("") + '</div></section>';
  h += '<footer><span>' + esc(y.sahip.ad) + ' · ' + esc(name) + ' · ' + esc(y.tip.ad) + '</span><span>Tasarım ve içerik: ' + esc(y.sahip.ad) + ' · Claude ile geliştirildi</span></footer>';
  $("app").innerHTML = h;

  var rail = $("rail");
  rail.innerHTML = y.odalar.map(function(r, i){ return '<button data-goto="' + esc(r.id) + '"><em>' + esc(r.ad) + '</em>' + pad(i + 1) + '<i></i></button>'; }).join("");
  y.odalar.forEach(function(r, i){ show(i, 0); });
  watch();
}

var cur = [];
function show(i, j){
  var r = D.odalar[i], s = r.adimlar[j]; cur[i] = j;
  var body = s.govde.replace('<div class="gantt" id="gantt"></div>', r.gantt ? gantt(r.gantt) : "");
  var el = $("step" + i);
  el.innerHTML = "<h3>" + esc(s.baslik) + "</h3>" + body;
  el.scrollTop = 0;
  $("cnt" + i).textContent = (j + 1) + " / " + r.adimlar.length;
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button[data-r="' + i + '"]'), function(b){ b.setAttribute("aria-selected", String(+b.dataset.s === j)); });
}

function watch(){
  var rooms = document.querySelectorAll(".room"), btns = $("rail").children;
  if (!("IntersectionObserver" in window)) return;
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      var i = +e.target.dataset.i;
      Array.prototype.forEach.call(btns, function(b, k){ b.setAttribute("aria-current", String(k === i)); });
    });
  }, {threshold:.55});
  Array.prototype.forEach.call(rooms, function(r){ io.observe(r); });
}

/* kavram balonu */
var pop = $("pop");
function showPop(term, x, y){
  var k = findTerm(term); if (!k) return;
  pop.innerHTML = "<b>" + esc(k) + "</b>" + esc(GL[k]);
  pop.classList.add("on");
  var w = pop.offsetWidth, hgt = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  pop.style.left = Math.max(10, Math.min(vw - w - 10, x - w / 2)) + "px";
  pop.style.top = (y + hgt + 24 > vh ? y - hgt - 14 : y + 18) + "px";
}
function hidePop(){ pop.classList.remove("on"); }

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target : null; if (!t) return;
  var b = t.closest("[data-r],[data-prev],[data-next],[data-term],.k,[data-goto]");
  if (!b){ hidePop(); return; }
  if (b.hasAttribute("data-r")) show(+b.dataset.r, +b.dataset.s);
  else if (b.hasAttribute("data-prev")){ var i = +b.dataset.prev; show(i, Math.max(0, (cur[i] || 0) - 1)); }
  else if (b.hasAttribute("data-next")){ var n = +b.dataset.next; show(n, Math.min(D.odalar[n].adimlar.length - 1, (cur[n] || 0) + 1)); }
  else if (b.hasAttribute("data-goto")){ var el = $(b.dataset.goto); if (el) el.scrollIntoView({behavior:"smooth"}); }
  else { var rc = b.getBoundingClientRect(); showPop(b.dataset.term || b.textContent, rc.left + rc.width / 2, rc.bottom); e.stopPropagation(); }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") hidePop(); });
window.addEventListener("scroll", hidePop, {passive:true});

fetch("yapi.json").then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
  D = d; GL = d.sozluk || {}; glKeys = Object.keys(GL);
  render();
}).catch(function(){
  $("app").innerHTML = '<p style="padding:120px 24px;color:#9aa4b5">İçerik yüklenemedi. <a href="../">CV\'ye dön</a></p>';
});
})();
</script>
